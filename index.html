
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Bird Flight</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main id="game">
    <canvas id="gameCanvas" width="640" height="640" aria-label="Bird flight game">
      Your browser does not support HTML5 Canvas.
    </canvas>
    <div id="keypad">
      <kbd data-key="Numpad1">1</kbd>
      <kbd data-key="Numpad2" class="pitch">2</kbd>
      <kbd data-key="Numpad3">3</kbd>
      <kbd data-key="Numpad4">4</kbd>
      <kbd data-key="Numpad5" class="pitch">5</kbd>
      <kbd data-key="Numpad6">6</kbd>
      <kbd data-key="Numpad7">7</kbd>
      <kbd data-key="Numpad8" class="pitch">8</kbd>
      <kbd data-key="Numpad9">9</kbd>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
